name: v0.2 offline suite

on:
  push:
    branches: [ "v0.2.0", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "v0.2.0" ]

jobs:
  contracts-and-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the history scan below needs every commit
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: environment (exactly uv.lock)
        run: uv sync --locked
      - name: hooks (lint, format, lock, requirements export, secrets, safety guards)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: secrets in the whole history
        run: uv run pre-commit run gitleaks-history --hook-stage manual
      - name: contracts + units (offline tier; LAN tiers are refused on CI)
        run: uv run pytest
