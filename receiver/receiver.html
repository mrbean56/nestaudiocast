<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoNetCaster</title>
<!--
  VideoNetCaster — custom Cast receiver for the owner's back-to-back sender (nac v0.2.0).

  Contract: docs/v020-contracts.md §3.  One JSON object per message, UTF-8, every message carries
  `type` and `seq`; `rx_ms` is the receiver clock (performance.timeOrigin + performance.now()).

  The only external URL on this page is the CAF receiver loader below: the device loads it.
  No analytics, no fonts, no CDN assets, no inline remote asset.

  Playback engines:
    * DASH (application/dash+xml) and everything else go through CAF's PlayerManager (shaka).
    * Timing-critical control (play_at, pause, seek, rate, sampling) goes straight to the
      underlying <video> element, so a command is one synchronous statement and one play().
      CAF watches the same element, so its media session stays truthful for other senders.
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #f5f5f5;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  }
  cast-media-player { --background-color: #000; --splash-image: none; }
  #idle {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #14202e 0%, #07090c 70%, #000 100%);
    color: #dfe9f3;
  }
  #idle.hidden { display: none; }
  #idle .card { text-align: center; }
  #idle h1 { font-size: 42px; font-weight: 600; margin: 0 0 8px; letter-spacing: .5px; }
  #idle p { font-size: 20px; margin: 0; opacity: .75; }
  #idle .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #35d07f; margin-right: 10px; vertical-align: middle;
  }
  #hud {
    position: absolute; left: 20px; bottom: 18px; font-size: 13px; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity: .5;
    pointer-events: none; white-space: pre;
  }
  #hud.hidden { display: none; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="idle">
  <div class="card">
    <h1>VideoNetCaster</h1>
    <p><span class="dot"></span><span id="idleStatus">ready</span></p>
  </div>
</div>
<div id="hud" class="hidden"></div>
<!--
  The frozen receiver URL (registered in the Cast console, so it cannot change) is a *stable
  loader*: the device caches this page, so anything that changes must live behind a URL the page
  fetches at load time. It reads /build.txt (served no-store) and loads /receiver.js?v=<build>.
  Consequence: a page update no longer costs a device reboot — only a relaunch.
-->
<script>
(function () {
  // The device caches by PATH and ignores query strings (measured 2026-10-26: /receiver.js?v=A
  // was fetched once and never again, for two later builds; the whole app, sub-resources
  // included, lives until a reboot). So every fetch here uses a path that changes when the
  // content could have changed: /b/<now>/build.txt and /r/<build>/receiver.js.
  function inject(build) {
    var s = document.createElement('script');
    s.src = '/r/' + encodeURIComponent(build) + '/receiver.js';
    s.onerror = function () { show('the page script failed to load'); };
    document.head.appendChild(s);
  }
  function show(why) {
    var el = document.getElementById('idle');
    if (el) { el.className = ''; el.textContent = 'VideoNetCaster: ' + why; }
  }
  var xhr = new XMLHttpRequest();
  try {
    xhr.open('GET', '/b/' + Date.now() + '/build.txt', true);
    xhr.onload = function () {
      var v = (xhr.responseText || '').trim();
      inject(v || String(Date.now()));
    };
    xhr.onerror = function () { inject(String(Date.now())); };
    xhr.send();
  } catch (e) { inject(String(Date.now())); }
})();
</script>
</body>
</html>
